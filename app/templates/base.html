<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Viewyland — vintage showpieces and timeless home decor.">
  <title>{% block title %}Viewyland — Objects with a past{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  {% if not hide_global_nav|default(false) %}{% include 'components/navbar.html' %}{% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <a class="brand" href="/">VIEWYLAND<span>.</span></a>
    <p>Vintage showpieces and collected objects for memorable homes.</p>
    <p class="footer-note">© 2026 Viewyland</p>
  </footer>
  {% block scripts %}{% endblock %}
  <script src="/static/js/cart.js" defer></script>
</body>
</html>
